name: Release
on:
  push:
    branches:
      - "main"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
    build-linux-x64:
      name: Build Linux x64
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7

        - name: Setup .NET
          uses: actions/setup-dotnet@v6
          with:
            dotnet-version: 9.x

        - name: Build DownloadArchive.Lib (linux-x64)
          run: dotnet publish DownloadArchive.Lib -r linux-x64 -o artifacts/native-libs/linux-x64

        - name: Build DownloadArchive.BuildTasks
          run: dotnet publish DownloadArchive.BuildTasks -o artifacts/tasks

        - name: Upload artifacts
          uses: actions/upload-artifact@v7
          with:
            name: artifacts-linux-x64
            path: artifacts

    build-linux-arm64:
      name: Build Linux ARM64
      runs-on: ubuntu-24.04-arm
      steps:
        - uses: actions/checkout@v7

        - name: Setup .NET
          uses: actions/setup-dotnet@v6
          with:
            dotnet-version: 9.x

        - name: Build DownloadArchive.Lib (linux-arm64)
          run: dotnet publish DownloadArchive.Lib -r linux-arm64 -o artifacts/native-libs/linux-arm64

        - name: Upload artifacts
          uses: actions/upload-artifact@v7
          with:
            name: artifacts-linux-arm64
            path: artifacts

    build-macos:
      name: Build macOS (x64 + arm64)
      runs-on: macos-latest
      steps:
        - uses: actions/checkout@v7

        - name: Setup .NET
          uses: actions/setup-dotnet@v6
          with:
            dotnet-version: 9.x

        - name: Build macOS x64
          run: dotnet publish DownloadArchive.Lib -r osx-x64 -o artifacts/native-libs/osx-x64

        - name: Build macOS ARM64
          run: dotnet publish DownloadArchive.Lib -r osx-arm64 -o artifacts/native-libs/osx-arm64


        - name: Upload artifacts
          uses: actions/upload-artifact@v7
          with:
            name: artifacts-osx
            path: artifacts

    build-windows:
      name: Build Windows (x64 + x86 + arm64)
      runs-on: windows-latest
      steps:
        - uses: actions/checkout@v7

        - name: Setup .NET
          uses: actions/setup-dotnet@v6
          with:
            dotnet-version: 9.x

        - name: Build Windows x64
          run: dotnet publish DownloadArchive.Lib -r win-x64 -o artifacts/native-libs/win-x64

        - name: Build Windows x86
          run: dotnet publish DownloadArchive.Lib -r win-x86 -o artifacts/native-libs/win-x86

        - name: Build Windows ARM64
          run: dotnet publish DownloadArchive.Lib -r win-arm64 -o artifacts/native-libs/win-arm64

        - name: Upload artifacts
          uses: actions/upload-artifact@v7
          with:
            name: artifacts-win
            path: artifacts

    pack:
        name: Pack
        runs-on: ubuntu-latest
        needs: [build-linux-x64, build-linux-arm64, build-macos, build-windows]
        steps:
        - uses: actions/checkout@v7

        - name: Download all artifacts
          uses: actions/download-artifact@v8
          with:
            pattern: artifacts-*
            path: artifacts
            merge-multiple: true

        - name: Show downloaded structure
          run: |
            echo "=== Artifacts Directory ==="
            tree artifacts || ls -R artifacts

        - name: Setup .NET
          uses: actions/setup-dotnet@v6
          with:
            dotnet-version: 9.x

        - name: Pack DownloadArchive
          run: |
            dotnet pack DownloadArchive \
              -p:DownloadArchiveNativeLibsDir="$(pwd)/artifacts/native-libs" \
              -p:DownloadArchiveTasksDir="$(pwd)/artifacts/tasks"

        - name: Show NuGet package contents
          run: |
            mkdir pkg
            for nupkg in DownloadArchive/bin/Release/*.nupkg; do
              echo "=== Contents of $nupkg ==="
              unzip -l "$nupkg"
              echo ""
            done

        - name: Upload package
          uses: actions/upload-artifact@v7
          with:
            name: package
            path: DownloadArchive/bin/Release

    test:
      name: Test on ${{ matrix.name }}
      runs-on: ${{ matrix.os }}
      needs: ["pack"]
      strategy:
        fail-fast: false
        matrix:
          include:
            - { name: Linux x64, os: ubuntu-latest, rid: linux-x64 }
            - { name: Linux ARM64, os: ubuntu-24.04-arm, rid: linux-arm64 }
            - { name: macOS x64, os: macos-15-intel, rid: osx-x64 }
            - { name: macOS ARM64, os: macos-latest, rid: osx-arm64 }
            - { name: Windows x64, os: windows-latest, rid: win-x64 }
            - { name: Windows ARM64, os: windows-11-arm, rid: win-arm64 }
      defaults:
        run:
          shell: bash
      env:
        PROJECT: ./DownloadArchive.ExampleWithNuget/DownloadArchive.ExampleWithNuget.csproj
        OUTPUT: DownloadArchive.ExampleWithNuget/bin
        ARCHIVE: gecko-driver-0.34.0
      steps:
        - uses: actions/checkout@v7

        - name: Setup .NET
          uses: actions/setup-dotnet@v6
          with:
            dotnet-version: 9.x

        - name: Download package
          uses: actions/download-artifact@v8
          with:
            name: package
            path: package

        - name: Remove existing nuget
          run: dotnet remove $PROJECT package DownloadArchive

        - name: Add nuget from archive
          run: dotnet add $PROJECT package DownloadArchive --source package

        - name: Build ExampleWithNuget project
          run: dotnet build $PROJECT

        - name: Check build output holds the archive for ${{ matrix.rid }}
          run: ./.github/scripts/check-archive.sh $OUTPUT/Debug/net9.0/$ARCHIVE ${{ matrix.rid }}

        - name: Publish ExampleWithNuget project
          run: dotnet publish $PROJECT

        - name: Check publish output holds the archive for every RID
          run: ./.github/scripts/check-archive.sh $OUTPUT/Release/net9.0/publish/$ARCHIVE linux-x64 linux-arm64 osx-x64 osx-arm64 win-x64 win-arm64

        - name: Clean ExampleWithNuget project
          run: dotnet clean $PROJECT

        - name: Check clean removed the archive
          run: |
            dir=$OUTPUT/Debug/net9.0/$ARCHIVE
            if [ -e "$dir" ]; then
              echo "::error::$dir still exists after clean"
              ls -R "$dir"
              exit 1
            fi

    publish:
        name: Publish
        runs-on: ubuntu-latest
        needs: ["test"]
        permissions:
          contents: read
          id-token: write # required to request the OIDC token for NuGet trusted publishing
        steps:
        - name: Setup .NET
          uses: actions/setup-dotnet@v6
          with:
            dotnet-version: 9.x

        - name: Download package
          uses: actions/download-artifact@v8
          with:
            name: package
            path: package

        # Exchanges the GitHub OIDC token for a NuGet.org API key that is valid for
        # one hour, so it has to stay directly in front of the push.
        - name: Login to NuGet
          id: nuget-login
          uses: NuGet/login@v1
          with:
            user: ${{ secrets.NUGET_USER }}

        - name: Publish nuget
          run: dotnet nuget push package/DownloadArchive.*.nupkg -k ${{ steps.nuget-login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
